[project]
name = "jobtracker"
version = "0.1.0"
description = "Job application tracker + career page monitor"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "pyjwt>=2.8",
    "bcrypt>=4.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "python-ulid>=2.2",
    "openpyxl>=3.1",
    "botocore[crt]>=1.42.58",
    "playwright>=1.58.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "moto>=5.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1,<2",  # hold at 1.x; 2.0 surfaces new errors, bump deliberately
    "ruff>=0.15.4",
    "types-beautifulsoup4>=4.12.0.20250516",
    "types-requests>=2.32.4.20260107",
]
